# 压测隔离数据根配置：上游指向 Bun mock 服务器
provider_id = "stressmock"
api_key = "set"
active_profile = "default"
compliance_enabled = false
permission_level = 4
auto_compact_threshold = 0.8

[profiles.default]
model = "stress-model"
max_tokens = 128000
effort = "max"
context_limit = 1000000
base_url = "http://127.0.0.1:18899/v1"
endpoint = "openai"

[subagent]
max_tokens = 4096
timeout_secs = 120
default_tools = [
    "read",
    "exec",
]

[workspace]
mode = "local"

[mcp]
enabled = false
import_external = false
idle_shutdown_secs = 300

[lsp]
enabled = false
idle_shutdown_secs = 120
