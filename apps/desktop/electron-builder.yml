appId: com.deepx.desktop
productName: DeepX

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

asar: true

extraResources:
  - from: build/sidecar/daemon-manifest.json
    to: daemon-manifest.json

win:
  executableName: DeepX
  extraResources:
    - from: build/sidecar/deepx-daemon.exe
      to: deepx-daemon.exe

linux:
  extraResources:
    - from: build/sidecar/deepx-daemon
      to: deepx-daemon
