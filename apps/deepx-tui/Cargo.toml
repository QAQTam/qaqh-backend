[package]
name = "deepx-tui"
version.workspace = true
edition.workspace = true
description = "DeepX terminal user interface — lightweight ratatui frontend"

[[bin]]
name = "deepx-tui"
path = "src/main.rs"

[dependencies]
deepx-client = { path = "../../crates/deepx-client" }
deepx-proto = { path = "../../crates/deepx-proto" }
ratatui = { version = "0.30", features = ["macros", "unstable-rendered-line-info"] }
crossterm = { version = "0.29", features = ["bracketed-paste"] }
ratatui-markdown = { path = "../../crates/ratatui-markdown", features = ["preview"] }
ratatui-textarea = "0.9"
similar = "3.1"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["clock"] }
unicode-width = "0.2"

[lints]
workspace = true
