[package]
name = "deepx-winui"
version.workspace = true
edition = "2024"
description = "DeepX WinUI desktop shell — windows-reactor 原生 XAML 视图族（WebView 已移除）"
license = "MIT"
publish = false

[dependencies]
deepx-client = { path = "../../crates/deepx-client" }
deepx-fluent = { path = "../../crates/deepx-fluent" }
# 原生 ChatView 渲染：协议事件 → Transcript → reactor 控件树
markdown-winui = { path = "../../crates/markdown-winui" }
# time: new_session 轮询等待 session_create 落库（对齐前端 15s 超时）。
tokio = { version = "1", features = ["time"] }
# preserve_order: action fingerprint 按 wire 字节序（事件字段顺序）复算，
# 与 daemon（preserve_order）保持一致，否则 config.save 等非字典序键的 action 报 400。
serde_json = { version = "1", features = ["preserve_order"] }
# P-2 typed struct：HeaderState/HeaderAction 编译期检查（预埋，见 WORKFLOW §6.1）。
serde = { version = "1", features = ["derive"] }
# Downstream Reactor extensions are kept in the durable fork and pinned so a
# clean machine reproduces the exact WinRT bindings and runtime setup.
windows-reactor = { git = "https://github.com/QAQTam/windows-rs.git", rev = "55c1998afca7d6d9d6befaf445d086278b3214a3" }
# desktop.openDialog / openImageDialog: Win32 IFileOpenDialog (COM) 绑定。
# 仅启用所需最小 feature 集（0.100.0 小写模块名 feature）。
windows = { git = "https://github.com/QAQTam/windows-rs.git", rev = "55c1998afca7d6d9d6befaf445d086278b3214a3", default-features = false, features = [
    "combaseapi",     # CoCreateInstance / CoTaskMemFree / CLSCTX_ALL
    "shobjidl_core",  # IFileOpenDialog / IFileDialog / IShellItem(Array) / SIGDN / FOS_*
    "shtypes",        # COMDLG_FILTERSPEC
    "windef",         # HWND（Show owner）
    "winerror",       # ERROR_CANCELLED（用户取消判定）
    "winuser",        # GetCursorPos / GetAsyncKeyState（splitter 差分拖拽）
] }

[build-dependencies]
windows-reactor-setup = { git = "https://github.com/QAQTam/windows-rs.git", rev = "55c1998afca7d6d9d6befaf445d086278b3214a3" }

[lints]
workspace = true
