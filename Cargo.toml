[workspace]
resolver = "2"
members = [
    "crates/qaqh-gate",
    "crates/qaqh-config-api",
    "crates/qaqh-config",
    "crates/qaqh-profile",
    "crates/qaqh-domain",
    "crates/qaqh-skills",
    "crates/qaqh-message",
    "crates/qaqh-types",
    "crates/qaqh-siwc",
    "crates/qaqh-dsaccount",
    "crates/qaqh-memwatch",
    "crates/qaqh-agent-runtime",
    "crates/qaqh-ringing-runtime",
    "crates/qaqh-runtime",
    "crates/qaqh-agentloop-core",
    "crates/qaqh-ringing",
    "crates/qaqh-ringing-contract",
    "crates/qaqh-daemon",
    "crates/qaqh-permission",
    "crates/qaqh-file-tools",
    "crates/qaqh-process-tools",
    "crates/qaqh-policy",
    "crates/qaqh-pty",
    "crates/qaqh-sandbox",
    "crates/qaqh-tool-core",
    "crates/qaqh-workspace",
    "crates/qaqh-session",
    "crates/qaqh-subagent",
    "crates/qaqh-client",
    "crates/qaqh-mcp",
    "crates/qaqh-lsp",
    "crates/sbx-nt",
    "crates/sbx-win",
    "crates/sbx-cli",
    "tools/qaqh-contract-export",
]

# 未接线 crate：功能源码保留，但不参与构建。
# qaqh-import = 外部 transcript 导入（全仓 0 调用者）；接线时移回 members。
exclude = ["crates/qaqh-import"]

[workspace.dependencies]
mutil-ai = { version = "0.7.0", path = "../mutil-ai" }
rmcp = { version = "3.2", default-features = false, features = ["client", "transport-child-process"] }
async-lsp = { version = "0.2", default-features = false, features = ["tokio", "omni-trait"] }
lsp-types = "0.95"

[workspace.package]
version = "2.0.20261028"
edition = "2024"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1

[workspace.lints.clippy]
unwrap_used = "deny"
string_slice = "deny"
# 每个 unsafe 块必须给出 SAFETY 依据（见 docs/adr 与各 crate 的 SAFETY 注释）。
undocumented_unsafe_blocks = "deny"
