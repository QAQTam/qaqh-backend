[workspace]
resolver = "2"
members = [
    "crates/qaqh-gate",
    "crates/qaqh-config-api",
    "crates/qaqh-config",
    "crates/qaqh-profile",
    "crates/qaqh-domain",
    "crates/qaqh-skills",
    "crates/qaqh-message",
    "crates/qaqh-types",
    "crates/qaqh-siwc",
    "crates/qaqh-dsaccount",
    "crates/qaqh-memwatch",
    "crates/qaqh-runtime",
    "crates/qaqh-ringing",
    "crates/qaqh-daemon",
    "crates/qaqh-fs-core",
    "crates/qaqh-git",
    "crates/qaqh-permission",
    "crates/qaqh-file-tools",
    "crates/qaqh-process-tools",
    "crates/qaqh-policy",
    "crates/qaqh-pty",
    "crates/qaqh-sandbox",
    "crates/qaqh-tool-core",
    "crates/qaqh-workspace",
    "crates/qaqh-spy",
    "crates/qaqh-session",
    "crates/qaqh-import",
    "crates/qaqh-subagent",
    "crates/qaqh-title",
    "crates/qaqh-client",
    "crates/qaqh-mcp",
    "crates/qaqh-lsp",
    "crates/sbx-nt",
    "crates/sbx-win",
    "crates/sbx-cli",
    "tools/qaqh-contract-export",
]

[workspace.dependencies]
mutil-ai = { version = "0.7.0", path = "../mutil-ai" }
rmcp = { version = "3.2", default-features = false, features = ["client", "transport-child-process"] }
async-lsp = { version = "0.2", default-features = false, features = ["tokio", "omni-trait"] }
lsp-types = "0.95"

[workspace.package]
version = "2.0.20261028"
edition = "2024"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1

[workspace.lints.clippy]
unwrap_used = "deny"
string_slice = "deny"
