[workspace]
resolver = "2"
members = [
    "crates/deepx-gate",
    "crates/deepx-config",
    "crates/deepx-domain",
    "crates/deepx-skills",
    "crates/deepx-msglp",
    "crates/deepx-message",
    "crates/deepx-types",
    "crates/deepx-proto",
    "crates/deepx-runtime",
    "crates/deepx-ringing",
    "crates/deepx-daemon",
    "crates/deepx-workspace",
    "crates/deepx-session",
    "crates/deepx-subagent",
    "crates/deepx-client",
    "crates/deepx-gate-testui",
    "crates/deepx-update",
    "crates/markdown-core",
    "crates/markdown-winui",
    "apps/installer",
    "apps/updater",
    "apps/winui",
]

[workspace.package]
version = "1.0.0-beta.8"
edition = "2024"
license = "MIT"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1

[workspace.lints.clippy]
unwrap_used = "deny"
string_slice = "deny"
