[package]
name = "dsx"
version = "4.0.0-alpha1"
edition = "2021"
description = "DeepSeek X — self-evolving agent platform. Coding is the first domain."

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "blocking"] }
html2text = "0.17"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = { version = "0.30", features = ["crossterm"] }
crossterm = { version = "0.29", features = ["event-stream", "bracketed-paste"] }
anyhow = "1"
thiserror = "2"
tokenizers = "0.23"
regex = "1"
pty-process = { version = "0.5", features = ["async"] }
chrono = "0.4"
log = "0.4"
simplelog = "0.12"
tui-markdown = "0.3.7"

[dev-dependencies]
tui-markdown = "0.3.7"
