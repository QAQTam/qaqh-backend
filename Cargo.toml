[workspace]
resolver = "2"
members = [
    "crates/mutil-ai",
    "crates/qaqh-gate",
    "crates/qaqh-config",
    "crates/qaqh-core-vocab",
    "crates/qaqh-profile",
    "crates/qaqh-skills",
    "crates/qaqh-hooks",
    "crates/qaqh-types",
    "crates/qaqh-siwc",
    "crates/qaqh-dsaccount",
    "crates/qaqh-oauth-core",
    "crates/qaqh-memwatch",
    "crates/qaqh-agent-runtime",
    "crates/qaqh-ringing-runtime",
    "crates/qaqh-runtime",
    "crates/qaqh-ringing",
    "crates/qaqh-ringing-contract",
    "crates/qaqh-ringing-v3",
    "crates/qaqh-daemon",
    "crates/qaqh-permission",
    "crates/qaqh-file-tools",
    "crates/qaqh-process-tools",
    "crates/qaqh-pty",
    "crates/qaqh-sandbox",
    "crates/qaqh-tool-core",
    "crates/qaqh-workspace",
    "crates/qaqh-gitx",
    "crates/qaqh-session",
    "crates/qaqh-subagent",
    "crates/qaqh-client",
    "crates/qaqh-acp",
    "crates/qaqh-mcp",
    "crates/qaqh-marketplace",
    "crates/qaqh-ffi",
    "crates/qaqh-harmony-napi",
    "crates/sbx-win",
    "crates/sbx-cli",
    "tools/qaqh-contract-export",
]

# 未接线 crate：功能源码保留，但不参与构建。
# qaqh-import = 外部 transcript 导入（全仓 0 调用者）；
# qaqh-ptc-* = P0-4 移出 workspace（全仓 0 外部调用者，不陪葬构建）；接线时移回 members。
exclude = [
    "crates/qaqh-import",
    "crates/qaqh-ptc-core",
    "crates/qaqh-ptc-bun",
    "crates/qaqh-ptc-sdk",
    "crates/qaqh-ptc-tools",
]

[workspace.dependencies]
mutil-ai = { version = "0.8.0", path = "crates/mutil-ai" }
# 精确锁（不用 ^）：避免 cargo update 把 SDK 漂到未验证的版本。3.10.0 为
# crates.io 最新稳定（2026-11-12）；qaqh-mcp 生产/dev、qaqh-runtime dev 全部
# 继承本行，见 ADR-0025。reqwest 0.13 / process-wrap 10 与之对齐。
rmcp = { version = "=3.10.0", default-features = false, features = ["client", "transport-child-process"] }

# v4.5 P2-2a：基础轮子统一声明单源（plan §三.4）。全仓手写 Base64 / hex /
# 固定 .tmp 原子写 / verbatim 剥前缀 / civil_from_days / 伪 ULID 一律退役到
# 这些成熟实现；版本用 ^ 区间即可（无 rmcp 那样的精确锁需求，接口面小）。
base64 = "0.23"
hex = "0.4"
tempfile = "3"
dunce = "1"
path-clean = "1"
chrono = { version = "0.4", features = ["clock"] }
ulid = "3"

# v4.5 P2-2b：系统级/重型手写轮子退役（plan §三.5）。`libc`/`windows-sys` 把
# 判活从子进程派生（tasklist / kill -0，L-27）换成原生系统调用；`jsonc-parser`
# （dprint，JSONC 权威实现，13.5M 下载）替掉 zed_integration 的 480 行手写
# JSONC 词法/剥离/拼接状态机。`cst` = 保留全部注释与空白的一等编辑 API；
# `serde_json` = CST 节点直读 serde_json::Value（Already 语义判定复用既有比较）。
libc = "0.2"
windows-sys = "0.61"
jsonc-parser = { version = "0.34", features = ["cst", "serde_json"] }

[workspace.package]
version = "4.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1

[workspace.lints.clippy]
unwrap_used = "deny"
string_slice = "deny"
# 每个 unsafe 块必须给出 SAFETY 依据（见 docs/adr 与各 crate 的 SAFETY 注释）。
undocumented_unsafe_blocks = "deny"
