# 一次性迁移数据（BYOK 前）。这里的内容不再是"可选 provider 目录"——
# 设置面只有六个字段（endpoint / wire / apikey / model / max_token / context_length）。
# 本文件只用于把老配置里的 (provider_id, endpoint) 坐标解析成具体的
# base_url + wire + compat，让升级不改变任何在途端点的请求形状。
# 迁移完成后（下个大版本）连同 registry 的 legacy 模块一起删除。
[[providers]]
id = "deepseek"
display = "DeepSeek"

[[providers.endpoints]]
id = "openai"
display = "OpenAI-compatible"
protocol = "openai"
base_url = "https://api.deepseek.com"
official_web_tools = true
user_id_mode = "Body"
thinking_mode = "OpenAi"
cache_field = "PromptCacheHitTokens"
include_stream_usage = true
has_balance = true
supports_thinking = true
thinking_budget_large = false
supports_reasoning_effort = true
tool_call_content_null = false
supports_reasoning_content = true
require_provider_parameters = false
stateful = false
beta = false
responses_web_search = true
responses_echo_web_search_call = true
responses_send_include = true
responses_effort_max = "high"
responses_supports_user = true
responses_echo_reasoning_content = true

