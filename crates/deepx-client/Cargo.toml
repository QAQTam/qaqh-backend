[package]
name = "deepx-client"
version.workspace = true
edition.workspace = true
description = "Reusable DeepX daemon client for Desktop and TUI"

[dependencies]
deepx-proto = { path = "../deepx-proto" }
deepx-ringing = { path = "../deepx-ringing" }
deepx-types = { path = "../deepx-types" }
futures-util = "0.3"
rand = "0.10"
serde_json = "1"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.30"
reqwest = { version = "0.13.4", default-features = false, features = ["stream", "rustls", "json"] }

[lints]
workspace = true
