[package]
name = "qaqh-config"
version.workspace = true
edition.workspace = true
description = "QAQ-Harness configuration: provider registry, config load/save"

[features]
default = []

[dependencies]
qaqh-policy = { path = "../qaqh-policy" }
qaqh-types = { path = "../qaqh-types" }
qaqh-config-api = { path = "../qaqh-config-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
log = "0.4"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(windows)'.dependencies]
# `Win32_Storage_FileSystem` 是 `secrets.rs::replace_file` 用 `MoveFileExW` 所需：
# 此前靠工作区里别的 crate 做 feature 合并才编得过，**单独构建本 crate 必炸**
# （`cargo test -p qaqh-siwc` 实证）。用到什么就声明什么。
windows = { version = "0.58", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_Storage_FileSystem"] }
[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
serde_json = "1"
# BUG-2026-09-13-15 回归测试：端到端断言非法 permission_level 经加载后
# 解析为 MaxLockdown（而非 Unrestricted），需复用 workspace 侧 permission 词汇表。
qaqh-workspace = { path = "../qaqh-workspace" }
