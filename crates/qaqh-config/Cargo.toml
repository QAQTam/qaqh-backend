[package]
name = "qaqh-config"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "QAQ-Harness configuration: provider registry, config load/save"

[features]
default = []

[dependencies]
thiserror = "2"
base64 = { workspace = true }
tempfile = { workspace = true }
qaqh-profile = { path = "../qaqh-profile" }
qaqh-types = { path = "../qaqh-types" }
qaqh-hooks = { path = "../qaqh-hooks" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
log = "0.4"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }
[lints]
workspace = true

[dev-dependencies]
serde_json = "1"
# BUG-2026-09-13-15 回归测试：端到端断言非法 permission_level 经加载后
# 解析为 MaxLockdown（而非 Unrestricted），需复用 workspace 侧 permission 词汇表。
qaqh-workspace = { path = "../qaqh-workspace" }
