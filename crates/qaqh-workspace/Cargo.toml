[package]
name = "qaqh-workspace"
version.workspace = true
edition.workspace = true
description = "QAQ-Harness in-process tool execution library"

[dependencies]
# Tool SDK 核心（P2 拆分）：typed 契约/描述符/投影/schema 的单一事实源。
qaqh-tool-core = { path = "../qaqh-tool-core" }
qaqh-skills = { path = "../qaqh-skills" }
qaqh-policy = { path = "../qaqh-policy" }
qaqh-sandbox = { path = "../qaqh-sandbox" }
# PR-3-3 新增依赖边：workspace → qaqh_domain（R-4：仅限 Dashboard* 三类型，禁止事件类型）
qaqh-domain = { path = "../qaqh-domain" }
qaqh-types = { path = "../qaqh-types" }
# spy 工具：工作区变更审计的模型面入口（journal/undo/restore/cat）。
qaqh-spy = { path = "../qaqh-spy" }
similar = { version = "3.1", features = ["text"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Tool SDK v1（09-15 spec Q1 已决策）：Args/Output schema 由类型生成。
schemars = "1"
# ToolError/FatalToolError 的诊断 source（base spec §7.1/§7.2，不序列化）。
anyhow = "1"
regex = "1"
ureq = { version = "3", features = ["json"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
    html2text = "0.17"
log = "0.4"
sha2 = "0.11"
unicode-normalization = "0.1"
hex = "0.4"
chrono = { version = "0.4", features = ["clock"] }
git2 = { version = "0.21", features = ["vendored-libgit2"] }
globset = "0.4.20"
ignore = "0.4.33"
grep-regex = "0.1"
grep-searcher = "0.1"


[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Storage_FileSystem"] }
sbx-win = { path = "../sbx-win" }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints]
workspace = true

[features]
# 测试装置：暴露 v1 `ToolManager::register`（legacy ToolHandler）供跨 crate 测试使用；
# 生产构建不启用。
test-harness = []

[dev-dependencies]
tempfile = "3"
[target.'cfg(unix)'.dependencies]
libc = "0.2"
