[package]
name = "qaqh-memwatch"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bounded release-mode process and runtime memory observability"

[dependencies]
serde = { version = "1", features = ["derive"] }
schemars = { version = "1.2", features = ["derive"], optional = true }
ts-rs = { version = "12", features = ["serde-compat", "serde-json-impl", "no-serde-warnings"], optional = true }

[features]
ts = ["dep:ts-rs"]
# JSON Schema projection (ADR-0008): the wire DTO is the source, never TypeScript.
schema = ["dep:schemars"]

[lints]
workspace = true
