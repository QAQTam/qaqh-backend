[package]
name = "qaqh-dsaccount"
description = "DeepSeek 账号（官网授权）：PKCE 回环授权、账号凭据、余额/赠金读取"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# 凭据密文盒子复用 secrets.toml 的同一套 DPAPI/0600 策略（单一实现，不重复造）。
qaqh-config = { path = "../qaqh-config" }
# `platform::config_path()`（凭据文件落在 config 同目录）。
qaqh-types = { path = "../qaqh-types" }
# 随机量与 sha256 走 ring：与 qaqh-siwc 同一套（PKCE 的 S256 就是 sha256）。
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
# 同步 HTTP：授权流程与回环监听跑在**专用 std 线程**上，不进 tokio。
ureq = { version = "3", features = ["json"] }
# 回调查询串解析（百分号编码手写是安全 bug 高发区）。
url = "2"

ts-rs = { version = "12", features = ["serde-compat", "serde-json-impl", "no-serde-warnings"], optional = true }

[features]
ts = ["dep:ts-rs"]

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
