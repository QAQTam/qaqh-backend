[package]
name = "qaqh-dsaccount"
description = "DeepSeek 账号（官网授权）：PKCE 回环授权、账号凭据、余额/赠金读取"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# 凭据密文盒子复用 secrets.toml 的同一套 DPAPI/0600 策略（单一实现，不重复造）。
qaqh-config = { path = "../qaqh-config" }
# `platform::config_path()`（凭据文件落在 config 同目录）。
qaqh-types = { path = "../qaqh-types" }
# OAuth 原生应用机械层（回环监听/PKCE 随机量/base64url/ureq 超时/
# 原子落盘）——与 qaqh-siwc 的公共归宿，v4.5 P2-1b（MUST 复制粘贴清剿）。
qaqh-oauth-core = { path = "../qaqh-oauth-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
# 推理端点 URL 校验与回调查询串的百分号解码（手写是安全 bug 高发区）。
url = "2"

ts-rs = { version = "12", features = ["serde-compat", "serde-json-impl", "no-serde-warnings"], optional = true }

[features]
ts = ["dep:ts-rs"]

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
