[package]
name = "deepx-daemon"
version.workspace = true
edition.workspace = true
description = "Headless DeepX application daemon"
build = "build.rs"

[dependencies]
deepx-config = { path = "../deepx-config" }
deepx-proto = { path = "../deepx-proto" }
deepx-domain = { path = "../deepx-domain" }
deepx-ringing = { path = "../deepx-ringing" }
deepx-runtime = { path = "../deepx-runtime" }
deepx-types = { path = "../deepx-types" }
log = "0.4"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[features]
default = ["memory"]
memory = ["deepx-runtime/memory"]

[lints]
workspace = true
