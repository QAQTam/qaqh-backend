[package]
name = "qaqh-config-api"
version.workspace = true
edition.workspace = true
description = "配置契约层（wire DTO）：ConfigDto 读模型 / ConfigPatch 写模型——winui/ratatui/web 三端共享的唯一真相"

[dependencies]
serde = { version = "1", features = ["derive"] }
# K1「只依赖 serde」靠 feature-gate 守住：`ts` 默认关，普通构建面不引入新依赖。
# webui 设置页的读写模型走 ts-rs 单一真相（`just ts-export`），不再手抄 wire 形状。
ts-rs = { version = "12", features = ["serde-compat", "serde-json-impl", "no-serde-warnings"], optional = true }

[features]
# web 端 TS 类型生成（ts-rs 单一真相）
ts = ["dep:ts-rs"]

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
