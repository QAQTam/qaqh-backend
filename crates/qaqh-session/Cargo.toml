[package]
name = "qaqh-session"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "QAQ-Harness session manager — singleton, list/load/save/active"

[features]
default = []
# web 端 TS 类型生成（ts-rs 单一真相）：投影 delta 是前端 applyProjection 的词表。
ts = ["dep:ts-rs", "qaqh-domain/ts"]

[dependencies]
qaqh-agentloop-core = { path = "../qaqh-agentloop-core" }
qaqh-ringing-contract = { path = "../qaqh-ringing-contract" }
qaqh-domain = { path = "../qaqh-domain" }
qaqh-types = { path = "../qaqh-types" }
qaqh-profile = { path = "../qaqh-profile" }
ts-rs = { version = "12", features = ["serde-compat", "serde-json-impl", "no-serde-warnings"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt"] }
qaqh-ringing = { path = "../qaqh-ringing" }
rusqlite = { version = "0.41", features = ["bundled"] }
toml = "1.1"
log = "0.4"
sha2 = "0.11"
hex = "0.4"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
qaqh-ringing-contract = { path = "../qaqh-ringing-contract" }
# Test-only: deterministic WAL read-fault injection (BUG-2026-09-13-06).
tempfile = "3"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
# Safe: only 2 string slices — one uses is_char_boundary, one is data eof check.
string_slice = "allow"

