[package]
name = "qaqh-domain"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ringing 共享领域类型：事件、状态、回合与业务值对象"

[dependencies]
qaqh-types = { path = "../qaqh-types" }
qaqh-ringing-contract = { path = "../qaqh-ringing-contract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `no-serde-warnings`：见 qaqh-types/Cargo.toml 的同名说明（`ConversationMode`
# 的 `alias = "normal"` 会触发 ts-rs 的 serde-compat 告警）。
ts-rs = { version = "12", features = ["serde-compat", "serde-json-impl", "no-serde-warnings"], optional = true }


[features]
ts = ["dep:ts-rs", "qaqh-types/ts", "qaqh-ringing-contract/ts"]

[lints]
workspace = true
