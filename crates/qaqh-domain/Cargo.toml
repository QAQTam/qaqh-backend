[package]
name = "qaqh-domain"
version.workspace = true
edition.workspace = true
description = "Ringing 领域层：中立 DomainCommand/DomainEvent，不依赖 legacy wire 类型"

[dependencies]
qaqh-types = { path = "../qaqh-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `no-serde-warnings`：见 qaqh-types/Cargo.toml 的同名说明（`ConversationMode`
# 的 `alias = "normal"` 会触发 ts-rs 的 serde-compat 告警）。
ts-rs = { version = "12", features = ["serde-compat", "serde-json-impl", "no-serde-warnings"], optional = true }


[features]
ts = ["dep:ts-rs", "qaqh-types/ts"]

[lints]
workspace = true
