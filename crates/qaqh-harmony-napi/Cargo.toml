[package]
name = "qaqh-harmony-napi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "qaqh_harmony"
crate-type = ["cdylib"]
test = false
doctest = false

[target.'cfg(target_env = "ohos")'.dependencies]
napi-ohos = { version = "1.2", features = ["async"] }
napi-derive-ohos = "1.2"
qaqh-client = { path = "../qaqh-client" }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "sync"] }

[build-dependencies]
napi-build-ohos = "1.2"

[lints]
workspace = true
