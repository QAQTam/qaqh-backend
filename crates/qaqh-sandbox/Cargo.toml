[package]
name = "qaqh-sandbox"
version.workspace = true
edition.workspace = true
description = "Platform capability discovery and Linux process sandboxing"

[dependencies]
log = "0.4"
qaqh-policy = { path = "../qaqh-policy" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
libc = "0.2"
seccompiler = "0.5.0"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
