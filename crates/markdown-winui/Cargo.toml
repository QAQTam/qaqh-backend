[package]
name = "markdown-winui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AST → windows-reactor 富文本模型对接原型：验证 fork 内 RichTextBlock 类型可直接消费解析产物"

[dependencies]
markdown-core = { path = "../markdown-core" }
# 直接依赖 fork 内的 reactor —— 验证"解析产物 = reactor 富文本模型"零胶水
# 本地开发态：path 指向 fork 工作区；release 打包前切回 git rev（同 deepx-fluent）。
windows-reactor = { path = "../../../deepx-winui-reactor/crates/libs/reactor" }
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
# SvgImageSource（Direct2D SVG）不支持 <text> 元素；usvg 负责把文字轮廓化为
# <path>（WriteOptions.preserve_text=false 默认行为），纯 Rust、系统字体兜底。
usvg = "0.47"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
