[package]
name = "qaqh-spy"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Workspace file-change audit: full-state scan + content-addressed snapshot store + bounded model-facing diff report"

[dependencies]
# 仅取 platform::data_dir()：让存储根跟随 QAQH_DATA_DIR（测试 harness / 多实例壳）。
qaqh-types = { path = "../qaqh-types" }
similar = { version = "3.1", features = ["text"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# 与 qaqh-workspace / audit 同一时间戳惯：chrono::Utc::now().to_rfc3339()（jiff 不入工作区）
chrono = { version = "0.4", features = ["clock"] }
sha2 = "0.11"
hex = "0.4"
ignore = "0.4.33"

[lints]
workspace = true
