[package]
name = "qaqh-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Headless QAQ-Harness application daemon"
build = "build.rs"

[dependencies]
qaqh-acp = { path = "../qaqh-acp" }
qaqh-config = { path = "../qaqh-config" }
qaqh-ringing = { path = "../qaqh-ringing" }
qaqh-ringing-contract = { path = "../qaqh-ringing-contract" }
qaqh-ringing-runtime = { path = "../qaqh-ringing-runtime" }
qaqh-mcp = { path = "../qaqh-mcp" }
qaqh-marketplace = { path = "../qaqh-marketplace" }
qaqh-runtime = { path = "../qaqh-runtime" }
qaqh-sandbox = { path = "../qaqh-sandbox" }
qaqh-process-tools = { path = "../qaqh-process-tools" }
qaqh-subagent = { path = "../qaqh-subagent" }
qaqh-goal = { path = "../qaqh-goal" }
# ADR-0033 切片 2：worktree 工具宿主安装（server.rs）。
qaqh-gitx = { path = "../qaqh-gitx" }
qaqh-session = { path = "../qaqh-session" }
qaqh-types = { path = "../qaqh-types" }
log = { version = "0.4", features = ["std"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
subtle = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
# ws: 用户 shell 终端数据面（ADR-0028 D3 裁定=候选 B）。除此之外不引任何新传输。
axum = { version = "0.8", features = ["ws"] }
# shell ws 数据面的 `stdin{bytes}` 是 base64（ADR-0028 §D3 约束 3：上行只有 text 一种
# 形状）。版本与 qaqh-file-tools 已声明的 0.23 同一条，不新增版本。
base64 = "0.23"
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.7", features = ["trace", "fs", "limit", "cors", "set-header", "util"] }
tokio-stream = "0.1"
futures-util = "0.3"
rustls = "0.23.45"
tokio-rustls = "0.26.6"
rustls-pemfile = "2.2.0"
rcgen = "0.14.10"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
# 越权矩阵用例需要 `qaqh_siwc::methods::ALL`（方法清单真源）与临时目录的管理器；
# 运行期依赖由 qaqh-runtime 传递，故只登记在 dev。
qaqh-siwc = { path = "../qaqh-siwc" }
tempfile = "3"
# v2_storm_tests 需要逐帧 poll SSE 响应体（回放尾的"部分读取+截止"语义）。
http-body-util = "0.1"
# shell_ws_tests 要一条**真**的 ws 握手：`oneshot` 伪造不出升级后的双向字节通道。
# 版本与 axum 的 ws feature 拉进来的那一条同版，不新增版本。
tokio-tungstenite = "0.29"
# shell_ws_tests 里还有一条用**真 SDK 客户端**打的往返（`qaqh_client::shell_stream`）：
# 切片 5 的判据是「客户端与服务端说的是同一套协议」，而手搓的 tungstenite 客户端证明
# 不了这一点——两边各自理解错、测试照样绿。daemon 的运行期不依赖客户端库，只登记 dev。
qaqh-client = { path = "../qaqh-client", features = ["shell-stream"] }

[lints]
workspace = true
