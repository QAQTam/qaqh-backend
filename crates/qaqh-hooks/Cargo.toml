[package]
name = "qaqh-hooks"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "QAQ-Harness lifecycle hooks: 事件词表、TOML/JSON 发现、matcher、信任存储、command/http runner 与五门 dispatcher"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1.13"
sha2 = "0.11"
hex = { workspace = true }
chrono = { workspace = true }
tempfile = { workspace = true }
log = "0.4"
tokio = { version = "1", features = ["sync", "time", "process", "rt", "io-util", "macros"] }
# 版本对齐 qaqh-mcp/rmcp 内部（0.13），避免双 reqwest 实例。
reqwest = { version = "0.13", default-features = false, features = ["json"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util", "process"] }

[lints]
workspace = true
