[package]
name = "deepx-config"
version.workspace = true
edition.workspace = true
description = "DeepX configuration: provider registry, prompts, config load/save"

[features]
default = []

[dependencies]
deepx-types = { path = "../deepx-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
log = "0.4"
[lints]
workspace = true
