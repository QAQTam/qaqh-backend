[package]
name = "qaqh-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GUI-independent QAQ-Harness daemon application runtime"

[dependencies]
qaqh-agent-runtime = { path = "../qaqh-agent-runtime" }
qaqh-ringing-runtime = { path = "../qaqh-ringing-runtime" }
qaqh-config = { path = "../qaqh-config" }
qaqh-config-api = { path = "../qaqh-config-api" }
qaqh-mcp = { path = "../qaqh-mcp" }
qaqh-lsp = { path = "../qaqh-lsp" }
qaqh-ringing = { path = "../qaqh-ringing" }
qaqh-ringing-contract = { path = "../qaqh-ringing-contract" }
qaqh-session = { path = "../qaqh-session" }
qaqh-subagent = { path = "../qaqh-subagent" }
qaqh-goal = { path = "../qaqh-goal" }
qaqh-workspace = { path = "../qaqh-workspace" }
qaqh-types = { path = "../qaqh-types" }
qaqh-profile = { path = "../qaqh-profile" }
qaqh-memwatch = { path = "../qaqh-memwatch" }
qaqh-skills = { path = "../qaqh-skills" }
sha2 = "0.11"
thiserror = "2"
ts-rs = { version = "12", features = ["serde-compat", "serde-json-impl", "no-serde-warnings"], optional = true }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Sign in with ChatGPT（套餐用量）：服务面 `siwc.*` 的全部实现。
qaqh-siwc = { path = "../qaqh-siwc" }
qaqh-dsaccount = { path = "../qaqh-dsaccount" }
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }

[features]
ts = ["dep:ts-rs", "qaqh-types/ts", "qaqh-siwc/ts", "qaqh-dsaccount/ts"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Registry", "Win32_System_WinRT", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "UI_Notifications", "Data_Xml_Dom", "Foundation_Collections"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
os_pipe = "1"
tiny_http = "0.12"
# 集成测试用 v1 ToolManager::register 注册探针工具（test-harness 只在测试构建启用）。
qaqh-workspace = { path = "../qaqh-workspace", features = ["test-harness"] }
# PR-M2-2 mcp_env_block：mock server 需 ServerHandler/service 形状。
rmcp = { workspace = true, features = ["transport-io", "server"] }
# 仅测试用：服务面白名单闸（`client_service_whitelist_mirrors_account_methods`）
# 需要同时看见 daemon 方法表、两家的 `methods::ALL` 与客户端白名单。
# 加 dev-dep 而不是正式依赖：runtime 不该依赖传输层。
qaqh-client = { path = "../qaqh-client" }
# 仅测试用：`ask_user_lifecycle` 直接驱动 `model_tool_plan` 的输入适配器
# 断言 plan 冻结后的参数形状；runtime 本体不依赖 tool-core。
# 需要 `native-tool-plan`：该子系统默认不编译（生产未接线），测试要直接驱动它。
qaqh-tool-core = { path = "../qaqh-tool-core", features = ["native-tool-plan"] }
# 集成测试里构造 mock 模型流与消息断言；core 本体不直接使用。
qaqh-gate = { path = "../qaqh-gate" }

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2"
