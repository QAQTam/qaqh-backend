[package]
name = "qaqh-types"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "QAQ-Harness shared type definitions"

[dependencies]
qaqh-hooks = { path = "../qaqh-hooks" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `no-serde-warnings`：ts-rs 的 serde-compat 对 `#[serde(alias = "…")]` 这类
# 与 TS 形状无关的键会打 `failed to parse serde attribute` 编译告警。别名只影响反序列化
# 输入，不影响生成的 TS 类型，故关闭该告警。
ts-rs = { version = "12", features = ["serde-compat", "serde-json-impl", "no-serde-warnings"], optional = true }
sha2 = "0.11"
toml = "1.1"
hex = { workspace = true }
chrono = { workspace = true }
dunce = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(windows)'.dependencies]
# v4.5 P2-2b（L-27）：`process_is_running` 的 OpenProcess/GetExitCodeProcess 直查。
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
# v4.5 P2-2b（L-27）：`process_is_running` 的 kill(pid, 0) 存活/权限探测。
libc = { workspace = true }

[features]
# web 端 TS 类型生成（ts-rs，单一真相）：config-revamp C1 同款 feature-gate，默认关
ts = ["dep:ts-rs"]

[lints]
workspace = true
