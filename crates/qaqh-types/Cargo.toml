[package]
name = "qaqh-types"
version.workspace = true
edition.workspace = true
description = "QAQ-Harness shared type definitions"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `no-serde-warnings`：ts-rs 的 serde-compat 对 `#[serde(alias = "…")]` 这类
# 与 TS 形状无关的键会打 `failed to parse serde attribute` 编译告警（本仓
# `qaqh-domain/src/command.rs` 的 `ConversationMode::Code` 就命中），而
# `cargo clippy --all-features -- -D warnings` 会因此红。别名只影响反序列化
# 输入，不影响生成的 TS 类型，故关闭该告警。
ts-rs = { version = "12", features = ["serde-compat", "serde-json-impl", "no-serde-warnings"], optional = true }
sha2 = "0.11"
toml = "1.1"
tokenizers = { version = "0.23", optional = true }

[features]
# web 端 TS 类型生成（ts-rs，单一真相）：config-revamp C1 同款 feature-gate，默认关
ts = ["dep:ts-rs"]
default = ["tokenizers"]
tokenizers = ["dep:tokenizers"]

[lints]
workspace = true
