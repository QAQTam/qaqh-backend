[package]
name = "qaqh-process-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "QAQ-Harness process tool group: exec + process registry/inspect (P2 crate split from the workspace facade crate)"

[dependencies]
qaqh-types = { path = "../qaqh-types" }
qaqh-ringing-contract = { path = "../qaqh-ringing-contract" }
qaqh-permission = { path = "../qaqh-permission" }
qaqh-tool-core = { path = "../qaqh-tool-core" }
qaqh-file-tools = { path = "../qaqh-file-tools" }
qaqh-sandbox = { path = "../qaqh-sandbox" }
qaqh-pty = { path = "../qaqh-pty" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = { workspace = true }
schemars = "1"
anyhow = "1"
log = "0.4"
regex = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
sbx-win = { path = "../sbx-win" }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
