[package]
name = "qaqh-tool-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "QAQ-Harness Tool SDK core: typed tool contract, descriptor, projection, schema (P2 crate split from qaqh-workspace)"

[features]
# 原生工具计划（Codex custom / namespace tool）。**默认关**：生产路径不使用它，
# 只有 `qaqh-gate` 的 `native-tool-plan` 转发与相关协议 fixture 测试会打开。
native-tool-plan = []

[dependencies]
qaqh-types = { path = "../qaqh-types" }
# ToolCategory/PermissionLevel/PermissionDecision 的单一事实源（workspace 经
# pub use 同源引用）。
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ToolError 的诊断 source（base spec §7.1/§7.2，不序列化）。
anyhow = "1"
log = "0.4"
# 进程内 Tokio 宿主选择与同步线程等待桥（async_rt，v4.4 P1-1）：工具执行面是
# 同步的，MCP/LSP 的 async actor 必须落到某个被驱动的 runtime 上。
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }

[dev-dependencies]
qaqh-permission = { path = "../qaqh-permission" }
tempfile = "3"

[lints]
workspace = true
