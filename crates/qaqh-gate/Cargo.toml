[package]
name = "qaqh-gate"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "QAQ-Harness LLM API gateway — HTTP streaming, message conversion"

[features]
# 转发 tool-core 的原生工具计划（**默认关**）。打开后 `ModelToolPlan` re-export 与
# `chat_stream_responses_with_plan` 才存在；生产路径走 `chat_stream`（不带 plan）。
native-tool-plan = ["qaqh-tool-core/native-tool-plan"]

[dependencies]
qaqh-types = { path = "../qaqh-types" }
qaqh-tool-core = { path = "../qaqh-tool-core" }
mutil-ai = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }
# 仅用其 HeaderName/HeaderValue 类型（与 mutil-ai 同一 reqwest 版本谱系）；
# HTTP 客户端本体已由 mutil-ai 承担。
reqwest = { version = "0.13.4", default-features = false }
futures = "0.3"
anyhow = "1"
log = "0.4"
unicode-normalization = "0.1"

[dev-dependencies]
tiny_http = "0.12"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
# All string slices in this crate use indices from find() on ASCII patterns
# (<, >, \n, "data: ", etc.), always on UTF-8 character boundaries.
string_slice = "allow"

