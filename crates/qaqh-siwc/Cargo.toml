[package]
name = "qaqh-siwc"
description = "Sign in with ChatGPT（ChatGPT plan usage）：动态注册 OAuth、凭据存储、模型发现"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# 凭据密文盒子复用 secrets.toml 的同一套 DPAPI/0600 策略（单一实现，不重复造）。
qaqh-config = { path = "../qaqh-config" }
# `platform::data_dir()` 与 `sha256_hex`。
qaqh-types = { path = "../qaqh-types" }
# OAuth 原生应用机械层（回环监听/PKCE 随机量/base64url/ureq 超时/
# 原子落盘）——与 qaqh-dsaccount 的公共归宿，v4.5 P2-1b（MUST 复制粘贴清剿）。
qaqh-oauth-core = { path = "../qaqh-oauth-core" }
log = "0.4"
# JWKS RSA 验签走 aws-lc-rs：与 daemon 服务端 TLS 同一栈（ADR-0039）。
# OHOS 不消费本 crate，无 ring 保留诉求。
aws-lc-rs = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
# URL 构造/查询解析：授权 URL 的参数编码与回环回调的查询串都交给它，
# 手写百分号编码是安全 bug 的高发区（回调 URI 必须与 token 交换逐字一致）。
url = "2"
ts-rs = { version = "12", features = ["serde-compat", "serde-json-impl", "no-serde-warnings"], optional = true }

[features]
ts = ["dep:ts-rs"]

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
