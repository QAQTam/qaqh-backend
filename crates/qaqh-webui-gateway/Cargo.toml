[package]
name = "qaqh-webui-gateway"
version.workspace = true
edition.workspace = true
description = "Loopback-only browser gateway for the QAQ-Harness WebUI"
license.workspace = true
build = "build.rs"

[dependencies]
axum = "0.8"
log = "0.4"
qaqh-domain = { path = "../qaqh-domain" }
qaqh-ringing = { path = "../qaqh-ringing" }
qaqh-types = { path = "../qaqh-types" }
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
