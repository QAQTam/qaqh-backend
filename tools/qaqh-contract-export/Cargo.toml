[package]
name = "qaqh-contract-export"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
qaqh-config-api = { path = "../../crates/qaqh-config-api", features = ["ts"] }
qaqh-profile = { path = "../../crates/qaqh-profile", features = ["ts"] }
qaqh-ringing = { path = "../../crates/qaqh-ringing", features = ["ts"] }
qaqh-ringing-contract = { path = "../../crates/qaqh-ringing-contract", features = ["ts"] }
qaqh-ringing-runtime = { path = "../../crates/qaqh-ringing-runtime", features = ["ts"] }
qaqh-types = { path = "../../crates/qaqh-types", features = ["ts"] }
qaqh-runtime = { path = "../../crates/qaqh-runtime", features = ["ts"] }
qaqh-siwc = { path = "../../crates/qaqh-siwc" }
qaqh-dsaccount = { path = "../../crates/qaqh-dsaccount" }
qaqh-memwatch = { path = "../../crates/qaqh-memwatch", features = ["ts", "schema"] }
ts-rs = { version = "12", features = ["serde-compat", "serde-json-impl", "no-serde-warnings"] }
schemars = { version = "1.2", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
