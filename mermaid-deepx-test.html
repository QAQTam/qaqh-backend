<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>DeepX Mermaid 配置精确复现测试</title>
    <style>
        body { font-family: -apple-system, sans-serif; max-width: 1200px; margin: 2em auto; }
        .test-case { margin: 1.5em 0; padding: 1em; border: 1px solid #ccc; border-radius: 8px; }
        .test-case h3 { margin-top: 0; }
        .result { min-height: 60px; padding: 0.5em; border: 1px solid #ddd; border-radius: 4px; margin-top: 0.5em; }
        .pass { border-color: #4CAF50; background: #f1f8f1; }
        .fail { border-color: #f44336; background: #fef0f0; }
        .error-msg { color: #c44; font-size: 12px; font-family: monospace; }
        .code { font-family: monospace; font-size: 12px; background: #f4f4f4; padding: 0.3em 0.5em; border-radius: 3px; white-space: pre-wrap; }
        .config-label { font-weight: bold; color: #666; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; font-size: 14px; }
        hr { margin: 2em 0; }
    </style>
</head>
<body>
    <h1>🔍 DeepX Mermaid 精确复现测试</h1>
    <p>每个按钮使用 <strong>独立的 mermaid 实例</strong>（通过 iframe），避免全局状态干扰。</p>

    <button onclick="runTest('default')">运行默认配置</button>
    <button onclick="runTest('deepx')">运行 DeepX 配置</button>
    <button onclick="runTest('script-path')">运行 script 路径模拟</button>

    <div id="results"></div>

    <script>
        const testCases = [
            { name: "双向箭头 无标签", code: "graph TD\n    A <--> B" },
            { name: "双向箭头 + 标签", code: 'graph TD\n    A <-->|"双向通信"| B' },
            { name: "双向粗箭头 + 标签", code: 'graph TD\n    A <==>|"WebSocket"| B' },
            { name: "双向粗箭头 + br标签", code: 'graph TD\n    A <==>|"WebSocket<br/>ws://127.0.0.1"| B' },
            { name: "单向箭头 + 标签", code: 'graph TD\n    A -->|"HTTP"| B' },
            { name: "无向边 + 标签", code: 'graph TD\n    A ---|"连接"| B' },
        ];

        const configs = {
            default: {
                label: "默认配置",
                init: { startOnLoad: false, theme: "default" }
            },
            deepx: {
                label: "DeepX 配置 (theme:base, htmlLabels:true, deterministicIds:true)",
                init: {
                    startOnLoad: false,
                    theme: "base",
                    themeVariables: {
                        primaryColor: "#f4f2ef",
                        primaryTextColor: "#1e1e1e",
                        primaryBorderColor: "#c8c4bc",
                        lineColor: "#c8c4bc",
                        secondaryColor: "#ebe8e3",
                        tertiaryColor: "#e0dcd6",
                        nodeBorder: "#c8c4bc",
                        nodeTextColor: "#1e1e1e",
                        actorBorder: "#c8c4bc",
                        actorBkg: "#f4f2ef",
                        actorTextColor: "#1e1e1e",
                        signalColor: "#1e1e1e",
                        signalTextColor: "#1e1e1e",
                        edgeLabelBackground: "#f4f2ef",
                        fontFamily: "system-ui, sans-serif",
                        fontSize: "11px",
                    },
                    flowchart: {
                        useMaxWidth: true,
                        htmlLabels: true,
                        padding: 8,
                        nodeSpacing: 16,
                        rankSpacing: 25,
                    },
                    sequence: {
                        useMaxWidth: true,
                        boxMargin: 8,
                        mirrorActors: false,
                    },
                    deterministicIds: true,
                    fontFamily: "system-ui, sans-serif",
                }
            }
        };

        let counter = 0;

        async function runTest(configKey) {
            const results = document.getElementById('results');
            results.innerHTML = '';

            if (configKey === 'script-path') {
                await runScriptPathTest();
                return;
            }

            const config = configs[configKey];
            results.innerHTML = `<h2>配置: ${config.label}</h2>`;

            // Load mermaid in an iframe to get a clean instance
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.srcdoc = `
                <!DOCTYPE html>
                <html><head>
                    <script src="https://cdn.jsdelivr.net/npm/mermaid@11.16.0/dist/mermaid.min.js"></scr` + `ipt>
                </head><body></body></html>
            `;
            document.body.appendChild(iframe);

            await new Promise(resolve => iframe.onload = resolve);
            const mermaid = iframe.contentWindow.mermaid;

            mermaid.initialize(config.init);

            for (const tc of testCases) {
                counter++;
                const id = `test-${configKey}-${counter}-${Date.now().toString(36)}`;

                const row = document.createElement('div');
                row.className = 'test-case';

                const label = document.createElement('h3');
                label.textContent = tc.name;

                const codeEl = document.createElement('div');
                codeEl.className = 'code';
                codeEl.textContent = tc.code;

                const resultEl = document.createElement('div');
                resultEl.className = 'result';

                try {
                    const { svg } = await mermaid.render(id, tc.code);
                    resultEl.innerHTML = svg;
                    resultEl.classList.add('pass');
                } catch (err) {
                    const msg = err instanceof Error ? err.message : String(err);
                    const short = msg.replace(/^Parse error on line \d+:\s*/, "").slice(0, 400);
                    resultEl.innerHTML = `<span class="error-msg">❌ ${short}</span>`;
                    resultEl.classList.add('fail');
                }

                row.appendChild(label);
                row.appendChild(codeEl);
                row.appendChild(resultEl);
                results.appendChild(row);
            }

            // Clean up iframe
            iframe.remove();
        }

        async function runScriptPathTest() {
            const results = document.getElementById('results');
            results.innerHTML = '<h2>script 路径模拟 (DeepX 配置 + script textContent 提取)</h2>';

            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.srcdoc = `
                <!DOCTYPE html>
                <html><head>
                    <script src="https://cdn.jsdelivr.net/npm/mermaid@11.16.0/dist/mermaid.min.js"></scr` + `ipt>
                </head><body></body></html>
            `;
            document.body.appendChild(iframe);

            await new Promise(resolve => iframe.onload = resolve);
            const mermaid = iframe.contentWindow.mermaid;

            mermaid.initialize(configs.deepx.init);

            for (const tc of testCases) {
                counter++;
                const id = `script-test-${counter}-${Date.now().toString(36)}`;

                const row = document.createElement('div');
                row.className = 'test-case';

                const label = document.createElement('h3');
                label.textContent = tc.name + ' (script路径)';

                const codeEl = document.createElement('div');
                codeEl.className = 'code';
                codeEl.textContent = tc.code;

                const resultEl = document.createElement('div');
                resultEl.className = 'result';

                // 模拟 DeepX 的 createMermaidPlaceholder → innerHTML → textContent 路径
                const safe = tc.code.replace(/<\/script>/gi, "<\\/script>");
                const wrapper = document.createElement('div');
                wrapper.innerHTML = '<script type="text/mermaid">' + safe + '</scr' + 'ipt>';
                const script = wrapper.querySelector('script[type="text/mermaid"]');
                const extracted = script ? script.textContent : null;

                const matchInfo = document.createElement('div');
                matchInfo.style.marginBottom = '0.5em';
                matchInfo.style.fontSize = '13px';
                if (extracted === tc.code) {
                    matchInfo.innerHTML = '<span style="color:green;">✅ textContent 与原始代码完全一致</span>';
                } else {
                    matchInfo.innerHTML = '<span style="color:red;">❌ textContent 不一致!</span><br>' +
                        '原始: <code>' + tc.code + '</code><br>' +
                        '提取: <code>' + extracted + '</code>';
                }

                try {
                    const { svg } = await mermaid.render(id, extracted || tc.code);
                    resultEl.innerHTML = svg;
                    resultEl.classList.add('pass');
                } catch (err) {
                    const msg = err instanceof Error ? err.message : String(err);
                    const short = msg.replace(/^Parse error on line \d+:\s*/, "").slice(0, 400);
                    resultEl.innerHTML = `<span class="error-msg">❌ ${short}</span>`;
                    resultEl.classList.add('fail');
                }

                row.appendChild(label);
                row.appendChild(codeEl);
                row.appendChild(matchInfo);
                row.appendChild(resultEl);
                results.appendChild(row);
            }

            iframe.remove();
        }
    </script>
</body>
</html>
