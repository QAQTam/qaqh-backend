name: LTS API guard

on:
  push:
    branches: [LTS-v3.1]
  pull_request:
    branches: [LTS-v3.1]

jobs:
  freeze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qaqh-backend
    steps:
      - uses: actions/checkout@v4
        with:
          path: qaqh-backend
      # Sibling path dependency (../mutil-ai), pinned to the tested 0.7.0
      # stream/custom-tool fixes used by the desktop build.
      - uses: actions/checkout@v4
        with:
          repository: qaqtam/mutil-ai
          ref: b37ca25f23350a8c6cb78bc69fda023f2cb809aa
          path: mutil-ai
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: qaqh-backend
      - name: Verify LTS API surface is frozen
        run: python3 scripts/check-lts-api-surface.py

  # 锁内偏离必须留痕（§1.5 的机器化）。不碰 Rust：纯 git + python，几十秒。
  change-policy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qaqh-backend
    steps:
      - uses: actions/checkout@v4
        with:
          path: qaqh-backend
          # 比对区间要能看到 base 侧历史。
          fetch-depth: 0
      - name: Assert the guard's own criteria hold
        run: python3 scripts/check-frozen-ledger.py --self-test
      - name: Assert frozen-surface changes carry a §7 ledger entry
        # PR 事件显式取回 base 侧（不赌 checkout 有没有建 origin/<base> 这个 ref ——
        # 上一版就是在这里静默走到了一条本地没跑过的 env 分支）。
        run: |
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            git fetch --no-tags origin "refs/heads/${GITHUB_BASE_REF}"
            python3 scripts/check-frozen-ledger.py --base FETCH_HEAD --head HEAD
          else
            python3 scripts/check-frozen-ledger.py
          fi
