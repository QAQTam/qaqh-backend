name: LTS API guard

on:
  push:
    branches: [LTS-v3.0]
  pull_request:
    branches: [LTS-v3.0]

jobs:
  freeze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qaqh-backend
    steps:
      - uses: actions/checkout@v4
        with:
          path: qaqh-backend
      # Sibling path dependency (../mutil-ai), pinned to the tested 0.7.0
      # stream/custom-tool fixes used by the desktop build.
      - uses: actions/checkout@v4
        with:
          repository: qaqtam/mutil-ai
          ref: 4387f74d2eff05b76fbbc3fa4a41b1a2fdf52ad4
          path: mutil-ai
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: qaqh-backend
      - name: Verify LTS API surface is frozen
        run: python3 scripts/check-lts-api-surface.py

  # 锁内偏离必须留痕（§1.5 的机器化）。不碰 Rust：纯 git + python，几十秒。
  change-policy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qaqh-backend
    steps:
      - uses: actions/checkout@v4
        with:
          path: qaqh-backend
          # 比对区间要能看到 base 侧历史。
          fetch-depth: 0
      - name: Assert the guard's own criteria hold
        run: python3 scripts/check-surface-change-policy.py --self-test
      - name: Assert frozen-surface changes carry a §7 ledger entry
        run: python3 scripts/check-surface-change-policy.py
