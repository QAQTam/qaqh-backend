<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepX Graph Demo — CSS Mindmap + Canvas Graph + Flowchart</title>
<style>
  :root {
    --bg: #fdf6ec;
    --card-bg: #fefaf2;
    --text: #3d3a35;
    --text-secondary: #8b8578;
    --accent: #b8860b;
    --accent-light: #d4a535;
    --line: #e0d5c1;
    --node-fill: #faf5eb;
    --node-stroke: #c8a84e;
    --edge: #c8b98a;
    --error: #c44;
    --code-bg: #f5efe0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 28px;
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 22px 24px;
    min-width: 380px;
    max-width: 600px;
    flex: 1 1 380px;
  }
  .card h2 {
    font-size: 15px;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 14px;
    padding-bottom: 9px;
    border-bottom: 1px solid var(--line);
  }
  textarea {
    width: 100%;
    background: var(--code-bg);
    color: #4a4538;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px;
    font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
    font-size: 13px;
    line-height: 1.5;
    resize: vertical;
    min-height: 90px;
  }
  textarea:focus { outline: none; border-color: var(--accent-light); }
  .preview {
    margin-top: 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: auto;
    min-height: 180px;
    max-height: 520px;
    background: var(--card-bg);
    position: relative;
  }
  .btn-row {
    margin-top: 8px;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  button {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 7px 15px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
  }
  button:hover { background: var(--accent-light); }
  button.secondary { background: #d4c9aa; color: #5a4e30; }
  button.secondary:hover { background: #c8b98a; }
  .hint {
    font-size: 12px;
    color: var(--text-secondary);
    margin-left: auto;
  }

  /* ═══════════════ CSS MINDMAP ═══════════════ */
  .css-mindmap {
    padding: 16px 20px;
    font-size: 13px;
    line-height: 1.7;
    user-select: none;
  }
  .mm-node {
    position: relative;
    padding: 3px 10px 3px 22px;
    margin: 1px 0;
    border-left: 1.5px solid var(--line);
    transition: background 0.15s;
    color: var(--text);
  }
  .mm-node:hover { background: rgba(184,134,11,0.06); }
  .mm-node::before {
    content: '';
    position: absolute;
    left: -1.5px;
    top: 50%;
    width: 12px;
    height: 1.5px;
    background: var(--line);
  }
  .mm-node.root {
    border-left: none;
    padding-left: 4px;
    font-weight: 600;
    color: var(--accent);
    font-size: 14px;
  }
  .mm-node.root::before { display: none; }

  /* ═══════════════ PLACEHOLDER (streaming) ═══════════════ */
  .render-placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 160px;
    color: var(--text-secondary);
    font-size: 13px;
    gap: 8px;
  }
  .render-placeholder .spinner {
    width: 16px; height: 16px;
    border: 2px solid var(--line);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  canvas.graph-canvas { display: block; border-radius: 8px; }
  .error-msg { color: var(--error); padding: 16px; font-size: 13px; }
</style>
</head>
<body>

<!-- ═══════════════ MINDMAP ═══════════════ -->
<div class="card">
  <h2>🧠 Mindmap — 2-space indent (Pure CSS)</h2>
  <textarea id="mindmap-input" spellcheck="false">DeepX Architecture
  crates (Rust Backend)
    deepx-daemon (entry / WS server)
    deepx-runtime (agent worker)
    deepx-tools (file, shell, git…)
    deepx-proto (IPC protocol)
  apps
    desktop (Electron + SolidJS)
    installer (egui)
  skills (SKILL.md discovery)</textarea>
  <div class="btn-row">
    <button id="mm-render-btn">Render</button>
    <button class="secondary" id="mm-stream-btn">Simulate Stream</button>
    <span class="hint" id="mm-status">ready</span>
  </div>
  <div class="preview" id="mindmap-preview"></div>
</div>

<!-- ═══════════════ GRAPH ═══════════════ -->
<div class="card">
  <h2>🔗 Graph — A -> B [label] (Canvas, horizontal layers)</h2>
  <textarea id="graph-input" spellcheck="false">Frontend -> Backend [label="HTTP API"]
Backend -> Database [label="SQL"]
Backend -> Cache [label="set/get"]
Frontend -> AuthService [label="OAuth2"]
AuthService -> Database [label="verify"]
Backend -> Queue [label="publish"]
Queue -> Worker [label="consume"]
Worker -> Database [label="write"]</textarea>
  <div class="btn-row">
    <button id="gr-render-btn">Render</button>
    <button class="secondary" id="gr-stream-btn">Simulate Stream</button>
    <span class="hint" id="gr-status">ready</span>
  </div>
  <div class="preview" id="graph-preview"></div>
</div>

<!-- ═══════════════ FLOWCHART ═══════════════ -->
<div class="card">
  <h2>📋 Flowchart — shape=diamond/rounded/box (Canvas, vertical)</h2>
  <textarea id="flowchart-input" spellcheck="false">Start [shape=rounded, label="用户发起请求"]
Start -> Auth
Auth [shape=diamond, label="已登录?"]
Auth -> Login [label="否"]
Login [shape=box, label="跳转登录页"]
Auth -> CheckPerm [label="是"]
CheckPerm [shape=diamond, label="有权限?"]
CheckPerm -> Deny [label="否"]
Deny [shape=box, label="返回 403"]
CheckPerm -> Process [label="是"]
Process [shape=rounded, label="处理请求"]
Process -> End
End [shape=rounded, label="返回结果"]</textarea>
  <div class="btn-row">
    <button id="fc-render-btn">Render</button>
    <button class="secondary" id="fc-stream-btn">Simulate Stream</button>
    <span class="hint" id="fc-status">ready</span>
  </div>
  <div class="preview" id="flowchart-preview"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// PARSERS
// ═══════════════════════════════════════════════════════════════

function parseMindmap(text) {
  const lines = text.split('\n').filter(l => l.trim());
  const parsed = lines.map(line => {
    const trimmed = line.trimStart();
    const indent = line.length - trimmed.length;
    let label = trimmed;
    if ((label.startsWith('"') && label.endsWith('"')) ||
        (label.startsWith("'") && label.endsWith("'"))) {
      label = label.slice(1, -1);
    }
    return { indent, label };
  });
  if (parsed.length === 0) return null;
  function buildTree(index) {
    const node = { label: parsed[index].label, children: [] };
    let i = index + 1;
    while (i < parsed.length && parsed[i].indent > parsed[index].indent) {
      const child = buildTree(i);
      node.children.push(child.node);
      i = child.nextIndex;
    }
    return { node, nextIndex: i };
  }
  return buildTree(0).node;
}

function parseGraph(text) {
  const edges = [];
  const nodeMap = new Map();
  const lines = text.split('\n').filter(l => l.trim() && !l.trim().startsWith('#'));

  for (const line of lines) {
    // standalone node def: Name [attrs]
    const nodeDef = line.match(/^"?([^"\n->]+?)"?\s*\[([^\]]*)\]\s*$/);
    if (nodeDef && !line.includes('->')) {
      const id = nodeDef[1].trim().replace(/^"|"$/g, '');
      const attrs = nodeDef[2];
      const shape = (attrs.match(/shape\s*=\s*"?(\w+)"?/i) || [])[1] || 'circle';
      const label = (attrs.match(/label\s*=\s*"([^"]*)"/) || [])[1] || id;
      nodeMap.set(id, { id, shape, label });
      continue;
    }
    // edge: A -> B [attrs]
    const m = line.match(/^"?([^"\n]+?)"?\s*->\s*"?([^"\n\[}]+?)"?\s*(?:\[([^\]]*)\])?$/);
    if (!m) continue;
    let src = m[1].trim().replace(/^"|"$/g, '');
    let tgt = m[2].trim().replace(/^"|"$/g, '');
    const attrs = m[3] || '';
    const label = (attrs.match(/label\s*=\s*"([^"]*)"/) || [])[1] || '';
    if (!nodeMap.has(src)) nodeMap.set(src, { id: src, shape: 'circle', label: src });
    if (!nodeMap.has(tgt)) nodeMap.set(tgt, { id: tgt, shape: 'circle', label: tgt });
    edges.push({ source: src, target: tgt, label });
  }
  return { nodes: [...nodeMap.values()], edges };
}

// ═══════════════════════════════════════════════════════════════
// MINDMAP RENDERER (pure CSS)
// ═══════════════════════════════════════════════════════════════

function renderMindmapNode(node, depth) {
  const cls = depth === 0 ? 'mm-node root' : 'mm-node';
  let html = `<div class="${cls}">${esc(node.label)}</div>`;
  if (node.children.length > 0) {
    html += '<div class="mm-children">';
    for (const child of node.children) html += renderMindmapNode(child, depth + 1);
    html += '</div>';
  }
  return html;
}

function renderMindmapTo(el, text) {
  try {
    const tree = parseMindmap(text);
    if (!tree) { el.innerHTML = '<div class="error-msg">Empty input</div>'; return; }
    el.innerHTML = '<div class="css-mindmap">' + renderMindmapNode(tree, 0) + '</div>';
  } catch (e) {
    el.innerHTML = `<div class="error-msg">Parse error: ${esc(e.message)}</div>`;
  }
}

// ═══════════════════════════════════════════════════════════════
// SHARED CANVAS DRAWING (graph + flowchart)
// ═══════════════════════════════════════════════════════════════

function drawCircle(ctx, x, y, r) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
  ctx.fillStyle = '#faf5eb'; ctx.fill();
  ctx.strokeStyle = '#c8a84e'; ctx.lineWidth = 1.5; ctx.stroke();
  return r;
}
function drawRounded(ctx, x, y, w, h) {
  const r = 10;
  ctx.beginPath();
  ctx.moveTo(x-w/2+r, y-h/2); ctx.lineTo(x+w/2-r, y-h/2);
  ctx.arcTo(x+w/2, y-h/2, x+w/2, y-h/2+r, r);
  ctx.lineTo(x+w/2, y+h/2-r); ctx.arcTo(x+w/2, y+h/2, x+w/2-r, y+h/2, r);
  ctx.lineTo(x-w/2+r, y+h/2); ctx.arcTo(x-w/2, y+h/2, x-w/2, y+h/2-r, r);
  ctx.lineTo(x-w/2, y-h/2+r); ctx.arcTo(x-w/2, y-h/2, x-w/2+r, y-h/2, r);
  ctx.closePath();
  ctx.fillStyle = '#faf5eb'; ctx.fill();
  ctx.strokeStyle = '#c8a84e'; ctx.lineWidth = 1.5; ctx.stroke();
}
function drawDiamond(ctx, x, y, w, h) {
  ctx.beginPath();
  ctx.moveTo(x, y-h/2); ctx.lineTo(x+w/2, y);
  ctx.lineTo(x, y+h/2); ctx.lineTo(x-w/2, y);
  ctx.closePath();
  ctx.fillStyle = '#faf5eb'; ctx.fill();
  ctx.strokeStyle = '#c87030'; ctx.lineWidth = 1.5; ctx.stroke();
}
function drawBox(ctx, x, y, w, h) {
  ctx.beginPath(); ctx.rect(x-w/2, y-h/2, w, h);
  ctx.fillStyle = '#faf5eb'; ctx.fill();
  ctx.strokeStyle = '#c8a84e'; ctx.lineWidth = 1.5; ctx.stroke();
}

function drawGraphCanvas(container, data, vertical = false) {
  container.innerHTML = '';
  const W = Math.max(container.clientWidth - 4, 380);
  const H = vertical ? Math.max(data.nodes.length * 60 + 80, 400) : 440;
  const canvas = document.createElement('canvas');
  canvas.className = 'graph-canvas';
  const scale = 2;
  canvas.width = W * scale; canvas.height = H * scale;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  container.appendChild(canvas);

  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);

  const { nodes, edges } = data;
  const padX = 70, padY = 44;

  let pos;
  if (vertical) {
    // ── Vertical layout (flowchart): root at top ──
    pos = layoutVertical(nodes, edges, W, H, padX, padY);
  } else {
    // ── Horizontal layout (graph): left → right ──
    pos = layoutHorizontal(nodes, edges, W, H, padX, padY);
  }

  // ── Draw edges ──
  ctx.strokeStyle = '#c8b98a';
  ctx.lineWidth = 1.3;
  ctx.lineCap = 'round';

  for (const e of edges) {
    const sp = pos.get(e.source), tp = pos.get(e.target);
    if (!sp || !tp) continue;

    if (vertical) {
      // Vertical: straight line + small bezier
      ctx.beginPath();
      ctx.moveTo(sp.x, sp.y);
      ctx.bezierCurveTo(sp.x, (sp.y+tp.y)/2, tp.x, (sp.y+tp.y)/2, tp.x, tp.y);
      ctx.stroke();
    } else {
      ctx.beginPath();
      const mx = (sp.x + tp.x) / 2;
      ctx.moveTo(sp.x, sp.y);
      ctx.bezierCurveTo(mx, sp.y, mx, tp.y, tp.x, tp.y);
      ctx.stroke();
    }

    // Arrow (only if moving downward or rightward)
    const dx = tp.x - sp.x, dy = tp.y - sp.y;
    const dist = Math.sqrt(dx*dx+dy*dy);
    if (dist < 4) continue;
    const angle = Math.atan2(dy, dx);
    const ax = tp.x - 16 * Math.cos(angle);
    const ay = tp.y - 16 * Math.sin(angle);
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(ax - 6 * Math.cos(angle - 0.55), ay - 6 * Math.sin(angle - 0.55));
    ctx.lineTo(ax - 6 * Math.cos(angle + 0.55), ay - 6 * Math.sin(angle + 0.55));
    ctx.closePath();
    ctx.fillStyle = '#c8b98a';
    ctx.fill();

    if (e.label) {
      ctx.fillStyle = '#8b8578';
      ctx.font = '10px system-ui';
      ctx.textAlign = 'center';
      const lx = (sp.x+tp.x)/2 + (vertical ? 14 : 0);
      const ly = (sp.y+tp.y)/2 - 8;
      ctx.fillText(e.label, lx, ly);
    }
  }

  // ── Draw nodes ──
  for (const n of nodes) {
    const p = pos.get(n.id);
    if (!p) continue;

    const shape = n.shape || 'circle';
    ctx.font = '11px system-ui, -apple-system, sans-serif';
    const textW = ctx.measureText(n.label.length > 14 ? n.label.slice(0,13)+'…' : n.label).width;
    const bw = Math.max(textW + 22, 56);

    switch (shape) {
      case 'diamond':
        drawDiamond(ctx, p.x, p.y, bw * 1.2, bw * 0.8);
        break;
      case 'rounded':
        drawRounded(ctx, p.x, p.y, bw + 8, 36);
        break;
      case 'box':
        drawBox(ctx, p.x, p.y, bw + 8, 30);
        break;
      default: {
        const r = Math.max(textW/2 + 12, 20);
        drawCircle(ctx, p.x, p.y, r);
        break;
      }
    }

    ctx.fillStyle = '#3d3a35';
    ctx.font = '11px system-ui, -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(n.label.length > 14 ? n.label.slice(0,13)+'…' : n.label, p.x, p.y);
  }
}

// ── Shared barycenter heuristic: reorder layers to minimize edge crossings ──

function barycenterOrder(layers, edges, forward) {
  // Compute neighbor positions for each node in every layer
  for (let pass = 0; pass < 2; pass++) {
    const range = forward ? [...Array(layers.length).keys()] : [...Array(layers.length).keys()].reverse();
    for (const li of range) {
      const layer = layers[li];
      const adjLayer = forward ? (li > 0 ? layers[li - 1] : null) : (li < layers.length - 1 ? layers[li + 1] : null);
      if (!adjLayer) continue;

      // Build y-position index for adjacent layer
      const adjY = new Map();
      for (let ni = 0; ni < adjLayer.length; ni++) {
        adjY.set(adjLayer[ni].id, ni);
      }

      // Compute barycenter for each node in current layer
      const withBary = layer.map(node => {
        const neighbors = edges
          .filter(e => forward ? e.target === node.id : e.source === node.id)
          .map(e => forward ? e.source : e.target);
        if (neighbors.length === 0) return { node, bary: layer.indexOf(node) }; // keep position
        const sum = neighbors.reduce((s, nid) => s + (adjY.get(nid) ?? layer.indexOf(node)), 0);
        return { node, bary: sum / neighbors.length };
      });

      // Sort layer by barycenter
      withBary.sort((a, b) => a.bary - b.bary);
      layers[li] = withBary.map(wb => wb.node);
    }
  }
}

function layoutHorizontal(nodes, edges, W, H, padX, padY) {
  const inDeg = new Map(nodes.map(n => [n.id, 0]));
  for (const e of edges) inDeg.set(e.target, (inDeg.get(e.target)||0)+1);
  const layer = new Map();
  const queue = [];
  for (const n of nodes) {
    if ((inDeg.get(n.id)||0)===0) { layer.set(n.id,0); queue.push(n.id); }
  }
  if (queue.length===0) { for (const n of nodes) { layer.set(n.id,0); queue.push(n.id); } }
  let maxL = 0;
  const visited = new Set();
  while (queue.length) {
    const id = queue.shift(); if (visited.has(id)) continue; visited.add(id);
    const l = layer.get(id);
    for (const e of edges.filter(e=>e.source===id)) {
      layer.set(e.target, Math.max(layer.get(e.target)||0, l+1));
      maxL = Math.max(maxL, l+1);
      if (!visited.has(e.target)) queue.push(e.target);
    }
  }
  for (const n of nodes) { if (!layer.has(n.id)) layer.set(n.id,0); }
  const layers = []; for (let i=0;i<=maxL;i++) layers.push(nodes.filter(n=>layer.get(n.id)===i));

  // ── Barycenter reordering ──
  barycenterOrder(layers, edges, true);   // forward pass
  barycenterOrder(layers, edges, false);  // backward pass

  const gap = (W-padX*2)/Math.max(maxL,1);
  const pos = new Map();
  for (let li=0;li<layers.length;li++) {
    const count = layers[li].length;
    const x = padX + li*gap;
    const ng = (H-padY*2)/Math.max(count,1);
    for (let ni=0;ni<count;ni++) pos.set(layers[li][ni].id, { x, y: padY+ni*ng+ng/2 });
  }
  return pos;
}

function layoutVertical(nodes, edges, W, H, padX, padY) {
  // Assign levels: start nodes at top, walk downward
  const inDeg = new Map(nodes.map(n => [n.id, 0]));
  for (const e of edges) inDeg.set(e.target, (inDeg.get(e.target)||0)+1);
  const level = new Map();
  const queue = [];
  for (const n of nodes) {
    if ((inDeg.get(n.id)||0)===0) { level.set(n.id,0); queue.push(n.id); }
  }
  if (queue.length===0) { for (const n of nodes) { level.set(n.id,0); queue.push(n.id); } }
  let maxLev = 0;
  const visited = new Set();
  while (queue.length) {
    const id = queue.shift(); if (visited.has(id)) continue; visited.add(id);
    const l = level.get(id);
    for (const e of edges.filter(e=>e.source===id)) {
      level.set(e.target, Math.max(level.get(e.target)||0, l+1));
      maxLev = Math.max(maxLev, l+1);
      if (!visited.has(e.target)) queue.push(e.target);
    }
  }
  for (const n of nodes) { if (!level.has(n.id)) level.set(n.id,0); }
  const layers = []; for (let i=0;i<=maxLev;i++) layers.push(nodes.filter(n=>level.get(n.id)===i));

  // ── Barycenter reordering (vertical: forward = top→down, backward = down→top) ──
  barycenterOrder(layers, edges, true);
  barycenterOrder(layers, edges, false);

  const vGap = (H-padY*2)/Math.max(maxLev,1);
  const pos = new Map();
  for (let li=0;li<layers.length;li++) {
    const count = layers[li].length;
    const y = padY + li*vGap;
    const hGap = (W-padX*2)/Math.max(count,1);
    for (let ni=0;ni<count;ni++) pos.set(layers[li][ni].id, { x: padX+ni*hGap+hGap/2, y });
  }
  return pos;
}

// ═══════════════════════════════════════════════════════════════
// STREAMING SIMULATION — key UX insight
// ═══════════════════════════════════════════════════════════════

function showPlaceholder(el) {
  el.innerHTML = `<div class="render-placeholder"><span class="spinner"></span> Rendering diagram…</div>`;
}

/*
  STREAMING STRATEGY:
  During model streaming, the code block text is incomplete.
  We show "Rendering diagram…" placeholder until the block closes.
  Once we receive the closing ```, we parse & render the complete diagram.

  This is exactly how MarkdownBody.tsx currently works:
  - Streaming phase: code block shown as raw (or placeholder)
  - Final phase:   code block converted to HTML + graph hydrated

  No need for progressive node-by-node reveal.
  The layout algorithm needs the full DSL text to compute positions.
*/

function simulateStream(textarea, preview, statusEl, renderFn, isMindmap) {
  const fullText = textarea.value;
  statusEl.textContent = 'streaming…';
  showPlaceholder(preview);

  const lines = fullText.split('\n');
  let i = 0;
  const interval = setInterval(() => {
    i++;
    if (i >= lines.length) {
      clearInterval(interval);
      // "code block closed" — render complete
      statusEl.textContent = 'complete ✓';
      renderFn(preview, fullText);
      return;
    }
    // Still streaming: keep placeholder
    const partial = lines.slice(0, i+1).join('\n');
    textarea.value = partial;
    statusEl.textContent = `streaming ${i+1}/${lines.length}…`;
  }, 200);
}

// ═══════════════════════════════════════════════════════════════
// HELPERS

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ═══════════════════════════════════════════════════════════════
// WIRING
// ═══════════════════════════════════════════════════════════════

const mmInput = document.getElementById('mindmap-input');
const mmPreview = document.getElementById('mindmap-preview');
const mmStatus = document.getElementById('mm-status');
const mmOrig = mmInput.value;

document.getElementById('mm-render-btn').onclick = () => {
  mmInput.value = mmOrig; renderMindmapTo(mmPreview, mmOrig); mmStatus.textContent = 'ready';
};
document.getElementById('mm-stream-btn').onclick = () => {
  mmStatus.textContent = 'streaming…';
  simulateStream(mmInput, mmPreview, mmStatus,
    (el, text) => renderMindmapTo(el, text), true);
};

const grInput = document.getElementById('graph-input');
const grPreview = document.getElementById('graph-preview');
const grStatus = document.getElementById('gr-status');
const grOrig = grInput.value;

document.getElementById('gr-render-btn').onclick = () => {
  try {
    const data = parseGraph(grOrig);
    grInput.value = grOrig;
    drawGraphCanvas(grPreview, data, false);
    grStatus.textContent = 'ready';
  } catch(e) { grPreview.innerHTML = `<div class="error-msg">${esc(e.message)}</div>`; }
};
document.getElementById('gr-stream-btn').onclick = () => {
  grStatus.textContent = 'streaming…';
  simulateStream(grInput, grPreview, grStatus,
    (el, text) => {
      try { drawGraphCanvas(el, parseGraph(text), false); } catch(e) { el.innerHTML = `<div class="error-msg">${esc(e.message)}</div>`; }
    }, false);
};

const fcInput = document.getElementById('flowchart-input');
const fcPreview = document.getElementById('flowchart-preview');
const fcStatus = document.getElementById('fc-status');
const fcOrig = fcInput.value;

document.getElementById('fc-render-btn').onclick = () => {
  try {
    const data = parseGraph(fcOrig);
    fcInput.value = fcOrig;
    drawGraphCanvas(fcPreview, data, true);
    fcStatus.textContent = 'ready';
  } catch(e) { fcPreview.innerHTML = `<div class="error-msg">${esc(e.message)}</div>`; }
};
document.getElementById('fc-stream-btn').onclick = () => {
  fcStatus.textContent = 'streaming…';
  simulateStream(fcInput, fcPreview, fcStatus,
    (el, text) => {
      try { drawGraphCanvas(el, parseGraph(text), true); } catch(e) { el.innerHTML = `<div class="error-msg">${esc(e.message)}</div>`; }
    }, false);
};

// Init
window.addEventListener('DOMContentLoaded', () => {
  renderMindmapTo(mmPreview, mmOrig);
  try { drawGraphCanvas(grPreview, parseGraph(grOrig), false); } catch(e) {}
  try { drawGraphCanvas(fcPreview, parseGraph(fcOrig), true); } catch(e) {}
});
</script>
</body>
</html>
